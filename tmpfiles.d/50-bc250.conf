# Keep authselect's validation metadata with the configuration it describes.
# L preserves an existing machine-local checksum written by authselect itself.
L /var/lib/authselect/checksum - - - - /etc/authselect/checksum

# Desktop RPM directories otherwise lost when bootc initializes /var.
d /var/lib/AccountsService 0775 root root - -
d /var/lib/AccountsService/icons 0775 root root - -
d /var/lib/AccountsService/users 0700 root root - -
d /var/lib/alsa 0755 root root - -
d /var/lib/flatpak 0755 root root - -
d /var/lib/geoclue 0755 geoclue geoclue - -
d /var/lib/tuned 0755 root root - -
d /var/log/tuned 0755 root root - -
