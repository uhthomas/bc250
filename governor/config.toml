# Dynamic GPU clocks; a conservative starting point for 24 or 40 CUs.
[timing.intervals]
sample = 250
adjust = 100_000

[gpu-usage]
fix-metrics = true
fix-freq = false
method = "busy-flag"
temp-read = "drm"
flush-every = 10

[gpu]
set-method = "smu"

[dbus]
enabled = true

[frequency-range]
min = 500
max = 1500

[timing.ramp-rates]
normal = 1
burst = 50

[timing]
burst-samples = 60
down-events = 5

[frequency-thresholds]
adjust = 10

[load-target]
upper = 0.65
lower = 0.50

[temperature]
throttling = 85
throttling_recovery = 75

[[safe-points]]
frequency = 500
voltage = 700

[[safe-points]]
frequency = 1000
voltage = 800

[[safe-points]]
frequency = 1175
voltage = 850

[[safe-points]]
frequency = 1500
voltage = 900
