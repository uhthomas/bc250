<text x="615" y="375" class="body" >C</text>
<circle cx="865" cy="340" r="11" fill="white" stroke="#52616e" stroke-width="2"/>
<text x="860" y="320" class="body" >A</text>
<circle cx="865" cy="455" r="11" fill="white" stroke="#52616e" stroke-width="2"/>
<text x="860" y="435" class="body" >B</text>
