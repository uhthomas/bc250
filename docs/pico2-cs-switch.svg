<path d="M876 340 H1110" fill="none" stroke="#d4a900" stroke-width="4" />
<text x="891" y="297" class="body" >Old PCB pad under leg 1</text>
<text x="891" y="322" class="small" >Motherboard CS#</text>
<path d="M876 455 H1110" fill="none" stroke="#267b91" stroke-width="4" />
<text x="891" y="418" class="body" >Pico GP7</text>
<text x="891" y="444" class="small" >physical pin 10</text>
<path d="M422 286 H480 V607 H380" fill="none" stroke="#b78417" stroke-width="3" />
<rect x="280" y="593" width="100" height="28" rx="2" fill="#ffedc0" stroke="#b78417"/>
<text x="330" y="584" class="body" text-anchor="middle">10 kΩ</text>
<path d="M280 607 H52 V286" fill="none" stroke="#d4a900" stroke-width="3" />
<text x="507" y="612" class="body" >Pull-up goes to BOARD VCC / chip leg 8.</text>
<text x="507" y="641" class="body" >Never connect it to Pico 3V3.</text>
<rect x="32" y="695" width="1136" height="263" rx="10" fill="#eaf3fb" stroke="#81a9c8"/>
<text x="50" y="728" class="head" >Meter checks, with both devices unplugged</text>
<text x="50" y="765" class="body" >STOCK: common/lifted leg → old pad/J4004 CS#. GP7 throw disconnected.</text>
<text x="50" y="800" class="body" >PICO: common/lifted leg → GP7. No direct copper connection to the old pad.</text>
<text x="50" y="835" class="body" >Keep the switch and soldered wires short. Insulate and strain-relieve the lifted leg.</text>
<text x="50" y="877" class="head" >Recovery: power off → STOCK → remove all Pico signal wires, especially MISO.</text>
<text x="50" y="912" class="body" >This switch bypasses only CS#. It cannot disconnect a Pico that is incorrectly driving MISO.</text>
<text x="50" y="941" class="small" >Full procedure and unchanged signal wiring: docs/pico2-wiring.md. Schematic, not board orientation.</text>
</svg>
