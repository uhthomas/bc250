<path d="M386 343 H422" fill="none" stroke="#52616e" stroke-width="8" />
<text x="102" y="329" class="small" >2</text>
<text x="395" y="329" class="small" >7</text>
<path d="M116 400 H80" fill="none" stroke="#52616e" stroke-width="8" />
<path d="M386 400 H422" fill="none" stroke="#52616e" stroke-width="8" />
<text x="102" y="386" class="small" >3</text>
<text x="395" y="386" class="small" >6</text>
<path d="M116 457 H80" fill="none" stroke="#52616e" stroke-width="8" />
<path d="M386 457 H422" fill="none" stroke="#52616e" stroke-width="8" />
<text x="102" y="443" class="small" >4</text>
<text x="395" y="443" class="small" >5</text>
<text x="181" y="311" class="small" >pin-1 dot</text>
<text x="180" y="377" class="body" >Other 7 legs</text>
<text x="170" y="405" class="body" >remain soldered</text>
<text x="54" y="521" class="body" >Leg 1 lifted clear of its old PCB pad.</text>
<text x="54" y="551" class="small" >Identify the real chip dot with magnification.</text>
<text x="470" y="224" class="head" >SPDT ON/ON — identify common with a meter</text>
<rect x="620" y="285" width="245" height="228" rx="10" fill="#eaf3fb" stroke="#81a9c8"/>
<text x="642" y="317" class="head" >STOCK</text>
<text x="642" y="485" class="head" >PICO</text>
