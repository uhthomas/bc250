<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">Later stage: switch only BIOS CS#</title><desc id="desc">Lift BIOS flash leg 1 from its pad. SPDT common to lifted leg, stock throw to old PCB pad, Pico throw to GP7 physical 10. Ten kiloohm resistor from lifted leg to board flash VCC leg 8. Switch only unpowered. Current firmware is not an active interposer.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#152433}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:650}.body{font-size:17px}.small{font-size:14px}.num{font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:central}</style>
<rect width="1200" height="1000" fill="#f7fafc"/>
<text x="34" y="46" class="title" >Later stage: STOCK / PICO chip-select switch</text>
<text x="34" y="78" class="body" >Do the passive capture and isolated bench test first. No chip modification is needed for stage 1.</text>
<rect x="32" y="106" width="1136" height="70" rx="10" fill="#fff1cd" stroke="#d0a449"/>
<text x="50" y="134" class="head" >Current UF2 files cannot boot the BC250 in the PICO switch position.</text>
<text x="50" y="160" class="body" >Keep STOCK for the first boot after rework. Move the switch only with all power disconnected.</text>
<text x="58" y="221" class="head" >Macronix BIOS flash — top view</text>
