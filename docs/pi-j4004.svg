<circle cx="385" cy="699" r="13" fill="#edf1f4"/><text x="385" y="699" class="num">40</text>
<text x="52" y="207" class="body">Pin 1 is at the top</text>
<text x="52" y="229" class="body">of the inner column.</text>
<text x="52" y="270" class="body" style="fill:#a21c1c">Pins 2 and 4 are 5 V.</text>
<text x="52" y="292" class="body" style="fill:#a21c1c">Leave them unused.</text>
<rect x="68" y="742" width="104" height="46" rx="4" fill="#c1cbd3" stroke="#52616e"/>
<rect x="183" y="742" width="104" height="46" rx="4" fill="#c1cbd3" stroke="#52616e"/>
<rect x="298" y="742" width="104" height="46" rx="4" fill="#c1cbd3" stroke="#52616e"/>
<text x="235" y="770" class="small" text-anchor="middle">USB / Ethernet end (schematic)</text>

<text x="415" y="488" class="small">CS#</text>
<text x="485" y="132" class="head">J4004 — viewed from above the BC250 PCB</text>
<text x="485" y="163" class="body">Rotate your view so the white triangle is below VCC.</text>
<text x="485" y="190" class="body">The coloured blocks below are the header positions.</text>
<rect x="485" y="235" width="155" height="113" rx="9" fill="#c1cbd3" stroke="#52616e"/>
<text x="562.5" y="272" class="signal">GND</text>
<text x="562.5" y="317" class="pin" text-anchor="middle">Pi 25</text>
<rect x="658" y="235" width="155" height="113" rx="9" fill="#6fdbbf" stroke="#52616e"/>
<text x="735.5" y="272" class="signal">SCLK</text>
<text x="735.5" y="317" class="pin" text-anchor="middle">Pi 23</text>
<rect x="831" y="235" width="155" height="113" rx="9" fill="#86c9f4" stroke="#52616e"/>
<text x="908.5" y="272" class="signal">MOSI</text>
<text x="908.5" y="317" class="pin" text-anchor="middle">Pi 19</text>
<rect x="1004" y="235" width="155" height="113" rx="9" fill="#edf1f4" stroke="#52616e"/>
<text x="1081.5" y="272" class="signal">unused</text>
<text x="1081.5" y="317" class="small" text-anchor="middle">no wire</text>
<rect x="485" y="368" width="155" height="113" rx="9" fill="#fbbf24" stroke="#52616e"/>
<text x="562.5" y="405" class="signal">VCC</text>
<text x="562.5" y="450" class="pin" text-anchor="middle">Pi 17</text>
<rect x="658" y="368" width="155" height="113" rx="9" fill="#f6abbe" stroke="#52616e"/>
<text x="735.5" y="405" class="signal">CS#</text>
<text x="735.5" y="450" class="pin" text-anchor="middle">Pi 24</text>
<rect x="831" y="368" width="155" height="113" rx="9" fill="#b2a4f4" stroke="#52616e"/>
<text x="908.5" y="405" class="signal">MISO</text>
<text x="908.5" y="450" class="pin" text-anchor="middle">Pi 21</text>
<rect x="1004" y="368" width="155" height="113" rx="9" fill="#f7fafc" stroke="#52616e" stroke-dasharray="6 5"/>
<text x="1081.5" y="405" class="signal">absent</text>
<text x="1081.5" y="450" class="small" text-anchor="middle">no pin</text>
<path d="M550 518 L562.5 495 L575 518 Z" fill="#ffffff" stroke="#52616e" stroke-width="2"/>
<text x="590" y="514" class="body">White triangle on the board = VCC corner</text>
<text x="485" y="561" class="head">Connect with both devices unplugged</text>
<text x="485" y="594" class="body">1. Remove clip; use six female-to-female 2.54 mm leads.</text>
<text x="485" y="626" class="body">2. Confirm the marker, missing pin and wire mapping.</text>
<text x="485" y="658" class="body">3. Leave the final J4004 column empty.</text>
<text x="485" y="708" class="head">Then power only the Pi</text>
<text x="485" y="741" class="body">BC250 PSU stays disconnected. Use 3.3 V only.</text>
<text x="485" y="773" class="body">Meter: J4004 VCC (+) to GND (−) ≈ +3.3 V.</text>
<text x="34" y="830" class="body">Labels “Pi 17”, etc. identify the other end of each wire; they are not J4004 pin numbers.</text>
<text x="34" y="858" class="small muted">Match the actual board marker and check continuity before power. Chip detection and two matching reads must pass before writing.</text>
</svg>
