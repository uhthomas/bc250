<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
<title id="title">Raspberry Pi 5 to BC250 J4004: six connections</title>
<desc id="desc">Pi physical pins 17 to VCC, 25 to GND, 24 to CS, 23 to SCLK, 19 to MOSI, 21 to MISO. J4004 viewed from above with its white triangle at lower left: top row GND SCLK MOSI unused; bottom row VCC CS MISO absent. Both devices unplugged while wiring; then power only the Pi.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#152433}.title{font-size:27px;font-weight:700}.head{font-size:21px;font-weight:650}.body{font-size:17px}.small{font-size:14px}.num{font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:central}.signal{font-size:22px;font-weight:700;text-anchor:middle}.pin{font-size:23px;font-weight:700;text-anchor:middle}.muted{fill:#52616e}</style>
<rect width="1200" height="880" fill="#f7fafc"/>
<text x="34" y="43" class="title">Raspberry Pi 5 → BC250 J4004</text>
<text x="34" y="73" class="body">Six wires. Every “Pi” number is a PHYSICAL position on the Pi’s 40-pin header.</text>
<rect x="30" y="100" width="420" height="690" rx="24" fill="#e2f2e8" stroke="#3d7656" stroke-width="2"/>
<text x="52" y="132" class="head">Pi 5 — top view</text>
<text x="52" y="155" class="small">USB / Ethernet sockets at the bottom</text>
<text x="390" y="154" class="small">Edge</text>
<rect x="325" y="170" width="85" height="554" rx="5" fill="#202a30"/>

