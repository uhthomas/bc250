<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120" role="img" aria-labelledby="title desc">
<title id="title">Waveshare USB CH347T programmer to BC250 J4004 wiring</title>
<desc id="desc">Pi USB-A connects to Waveshare USB-B; no Pi GPIO leads. Select 3.3 volts and M1 with switch 1 OFF and switch 2 ON while unplugged. The Waveshare SPI signals map GND to GND, CS0 to CS#, SCK to SCLK, SDO to MOSI, SDI to MISO, and VCC to VCC only after power checks. J4004 component-side view with white triangle below lower-left VCC: top row GND SCLK MOSI unused; bottom row VCC CS# MISO absent. First test the USB adapter alone, leaving all target leads disconnected. Keep BC250 PSU unplugged and disconnect USB before wiring.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}a text{text-decoration:underline}</style>
<rect x="0" y="0" width="1280" height="1120" rx="0" fill="#f6f8fb" stroke="none" />
<text x="36" y="49" font-size="32" font-weight="750" fill="#172b3a" text-anchor="start" >Waveshare → BC250 J4004</text>
<text x="36" y="82" font-size="18" font-weight="400" fill="#506477" text-anchor="start" >USB TO UART/I2C/SPI/JTAG (CH347T) • Connector views and six signal mappings</text>
<rect x="36" y="103" width="1208" height="76" rx="10" fill="#fff0d7" stroke="#d8b56d" />
<text x="55" y="132" font-size="20" font-weight="700" fill="#754700" text-anchor="start" >FIRST TEST: connect only the USB adapter. Leave every J4004 lead disconnected.</text>
<text x="55" y="159" font-size="17" font-weight="400" fill="#754700" text-anchor="start" >The previous hookup prevented Pi boot. Check wiring and target supply load before energizing J4004.</text>
