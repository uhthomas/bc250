<circle cx="385" cy="591" r="13" fill="#edf1f4"/><text x="385" y="591" class="num">32</text>
<circle cx="345" cy="618" r="13" fill="#edf1f4"/><text x="345" y="618" class="num">33</text>
<circle cx="385" cy="618" r="13" fill="#edf1f4"/><text x="385" y="618" class="num">34</text>
<circle cx="345" cy="645" r="13" fill="#edf1f4"/><text x="345" y="645" class="num">35</text>
<circle cx="385" cy="645" r="13" fill="#edf1f4"/><text x="385" y="645" class="num">36</text>
<circle cx="345" cy="672" r="13" fill="#edf1f4"/><text x="345" y="672" class="num">37</text>
<circle cx="385" cy="672" r="13" fill="#edf1f4"/><text x="385" y="672" class="num">38</text>
<circle cx="345" cy="699" r="13" fill="#edf1f4"/><text x="345" y="699" class="num">39</text>
<circle cx="385" cy="699" r="13" fill="#edf1f4"/><text x="385" y="699" class="num">40</text>
<text x="52" y="207" class="body">Pin 1 is at the top</text>
<text x="52" y="229" class="body">of the inner column.</text>
<text x="52" y="270" class="body" style="fill:#a21c1c">Pins 2 and 4 are 5 V.</text>
<text x="52" y="292" class="body" style="fill:#a21c1c">Leave them unused.</text>
<rect x="68" y="742" width="104" height="46" rx="4" fill="#c1cbd3" stroke="#52616e"/>
<rect x="183" y="742" width="104" height="46" rx="4" fill="#c1cbd3" stroke="#52616e"/>
<rect x="298" y="742" width="104" height="46" rx="4" fill="#c1cbd3" stroke="#52616e"/>
<text x="235" y="770" class="small" text-anchor="middle">USB / Ethernet end (schematic)</text>
<text x="485" y="132" class="head">MX25L12872F — top of package</text>
<text x="485" y="158" class="body">Confirm marking and pin-1 indicator before wiring.</text>
<rect x="720" y="218" width="190" height="220" rx="8" fill="#263440"/>
<circle cx="746" cy="245" r="8" fill="#f2f6f8"/>
<path d="M798 218 Q815 248 832 218" fill="#f7fafc"/>
<text x="815" y="329" class="body" text-anchor="middle" style="fill:#ffffff">FLASH</text>

<rect x="686" y="237" width="34" height="24" fill="#f6abbe" stroke="#52616e"/><text x="703" y="249" class="num">1</text><text x="673" y="246" class="body" text-anchor="end">CS#</text><text x="673" y="267" class="small" text-anchor="end">Pi 24</text>
<rect x="910" y="237" width="34" height="24" fill="#fbbf24" stroke="#52616e"/><text x="927" y="249" class="num">8</text><text x="958" y="246" class="body" text-anchor="start">VCC</text><text x="958" y="267" class="small" text-anchor="start">Pi 17 / 3.3 V</text>
<rect x="686" y="289" width="34" height="24" fill="#b2a4f4" stroke="#52616e"/><text x="703" y="301" class="num">2</text><text x="673" y="298" class="body" text-anchor="end">SO / MISO</text><text x="673" y="319" class="small" text-anchor="end">Pi 21</text>
<rect x="910" y="289" width="34" height="24" fill="#edf1f4" stroke="#52616e"/><text x="927" y="301" class="num">7</text><text x="958" y="298" class="body" text-anchor="start">SIO3</text><text x="958" y="319" class="small" text-anchor="start">No Pi wire</text>
<rect x="686" y="341" width="34" height="24" fill="#edf1f4" stroke="#52616e"/><text x="703" y="353" class="num">3</text><text x="673" y="350" class="body" text-anchor="end">SIO2</text><text x="673" y="371" class="small" text-anchor="end">No Pi wire</text>
<rect x="910" y="341" width="34" height="24" fill="#6fdbbf" stroke="#52616e"/><text x="927" y="353" class="num">6</text><text x="958" y="350" class="body" text-anchor="start">SCLK</text><text x="958" y="371" class="small" text-anchor="start">Pi 23</text>
<rect x="686" y="393" width="34" height="24" fill="#c1cbd3" stroke="#52616e"/><text x="703" y="405" class="num">4</text><text x="673" y="402" class="body" text-anchor="end">GND</text><text x="673" y="423" class="small" text-anchor="end">Pi 25</text>
<rect x="910" y="393" width="34" height="24" fill="#86c9f4" stroke="#52616e"/><text x="927" y="405" class="num">5</text><text x="958" y="402" class="body" text-anchor="start">SI / MOSI</text><text x="958" y="423" class="small" text-anchor="start">Pi 19</text>
<text x="485" y="488" class="head">Connection check</text>
<text x="485" y="526" class="mono">Pi 17 → chip 8     Pi 25 → chip 4</text>
<text x="485" y="559" class="mono">Pi 24 → chip 1     Pi 23 → chip 6</text>
<text x="485" y="592" class="mono">Pi 19 → chip 5     Pi 21 → chip 2</text>
<text x="485" y="634" class="body">Chip 3 / 7: no Pi wire for this part in single-bit SPI.</text>
<text x="485" y="659" class="body">Check the clip's actual wire mapping with a meter.</text>
<text x="485" y="706" class="head">Power sequence</text>
<text x="485" y="738" class="body">Connect with both devices unplugged.</text>
<text x="485" y="764" class="body">Then power only the Pi. BC250 PSU stays disconnected.</text>
<text x="34" y="831" class="body">First: voltage + ID + protection check → two matching full reads → compare with saved firmware.</text>
<text x="34" y="858" class="small muted">Conditional on MX25L12872F identification. This drawing shows pin positions, not the clip adapter's connector order.</text>
</svg>
