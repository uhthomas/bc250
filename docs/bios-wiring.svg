<circle cx="385" cy="375" r="13" fill="#edf1f4"/><text x="385" y="375" class="num">16</text>
<circle cx="345" cy="402" r="13" fill="#fbbf24"/><text x="345" y="402" class="num">17</text>
<text x="310" y="407" class="body" text-anchor="end">3.3 V → chip 8</text><path d="M314 402 H330" stroke="#52616e"/>
<circle cx="385" cy="402" r="13" fill="#edf1f4"/><text x="385" y="402" class="num">18</text>
<circle cx="345" cy="429" r="13" fill="#86c9f4"/><text x="345" y="429" class="num">19</text>
<text x="310" y="434" class="body" text-anchor="end">MOSI → chip 5</text><path d="M314 429 H330" stroke="#52616e"/>
<circle cx="385" cy="429" r="13" fill="#edf1f4"/><text x="385" y="429" class="num">20</text>
<circle cx="345" cy="456" r="13" fill="#b2a4f4"/><text x="345" y="456" class="num">21</text>
<text x="310" y="461" class="body" text-anchor="end">MISO → chip 2</text><path d="M314 456 H330" stroke="#52616e"/>
<circle cx="385" cy="456" r="13" fill="#edf1f4"/><text x="385" y="456" class="num">22</text>
<circle cx="345" cy="483" r="13" fill="#6fdbbf"/><text x="345" y="483" class="num">23</text>
