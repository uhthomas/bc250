<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
<title id="title">BC250 BIOS recovery: Pi 5 physical pins to MX25L12872F chip legs</title>
<desc id="desc">Six connections: Pi 17 to chip 8, Pi 25 to chip 4, Pi 24 to chip 1, Pi 23 to chip 6, Pi 19 to chip 5, Pi 21 to chip 2. Chip legs 3 and 7 have no programmer connection. Confirm the chip and its pin 1 before power.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#152433} .title{font-size:27px;font-weight:700}.head{font-size:21px;font-weight:650}.body{font-size:17px}.small{font-size:14px}.num{font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:central}.mono{font-family:monospace;font-size:18px}.muted{fill:#52616e}</style>
<rect width="1200" height="880" fill="#f7fafc"/>
<text x="34" y="43" class="title">BC250 BIOS recovery — six connections</text>
<text x="34" y="73" class="body">Pi numbers are PHYSICAL header positions. Flash numbers are CHIP LEGS.</text>
<rect x="30" y="100" width="420" height="690" rx="24" fill="#e2f2e8" stroke="#3d7656" stroke-width="2"/>
<text x="52" y="132" class="head">Pi 5 — top view</text>
<text x="52" y="155" class="small">USB / Ethernet sockets at the bottom</text>
<text x="390" y="154" class="small">Edge</text>
<rect x="325" y="170" width="85" height="554" rx="5" fill="#202a30"/>

