<circle cx="385" cy="510" r="13" fill="#edf1f4"/><text x="385" y="510" class="num">26</text>
<circle cx="345" cy="537" r="13" fill="#edf1f4"/><text x="345" y="537" class="num">27</text>
<circle cx="385" cy="537" r="13" fill="#edf1f4"/><text x="385" y="537" class="num">28</text>
