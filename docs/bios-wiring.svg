<circle cx="385" cy="294" r="13" fill="#edf1f4"/><text x="385" y="294" class="num">10</text>
<circle cx="345" cy="321" r="13" fill="#edf1f4"/><text x="345" y="321" class="num">11</text>
<circle cx="385" cy="321" r="13" fill="#edf1f4"/><text x="385" y="321" class="num">12</text>
<circle cx="345" cy="348" r="13" fill="#edf1f4"/><text x="345" y="348" class="num">13</text>
<circle cx="385" cy="348" r="13" fill="#edf1f4"/><text x="385" y="348" class="num">14</text>
