<circle cx="385" cy="240" r="13" fill="#edf1f4"/><text x="385" y="240" class="num">6</text>
<circle cx="345" cy="267" r="13" fill="#edf1f4"/><text x="345" y="267" class="num">7</text>
<circle cx="385" cy="267" r="13" fill="#edf1f4"/><text x="385" y="267" class="num">8</text>
