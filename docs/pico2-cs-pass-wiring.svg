<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">Physical pin locations for the BC250 Pico 2 CS pass-through trial</title>
<desc id="desc">Top view of the full Pico 2 forty-pin header with USB at the top, and J4004 with its white triangle below VCC. Connect Pico physical pin 4 GP2 to J4004 CS, Pico pin 8 GND to J4004 GND, and the lifted BIOS flash pin 1 socket to Pico pin 10 GP7. J4004 VCC and Pico GP26 pin 31 stay unconnected. The existing flash pull-up remains. Remove Pi SPI GPIO wires, leaving Pi USB only.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#172a37}.title{font-size:30px;font-weight:750}.head{font-size:23px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.tiny{font-size:13px}.pin{font-size:13px;font-weight:750;text-anchor:middle;dominant-baseline:central}.row{font-size:19px;font-weight:650}.muted{fill:#526676}</style>
<rect width="1200" height="1080" fill="#f7fafc"/>
<text x="34" y="48" class="title">Pico 2 + BC250 J4004 — actual header positions</text>
<text x="34" y="80" class="body">Look at the component side of the Pico, USB socket at the top. Numbers are physical header pins.</text>
<rect x="30" y="102" width="1140" height="60" rx="10" fill="#fff1cd" stroke="#c89425" stroke-width="2"/>
<text x="48" y="128" class="head">BC250 PSU and Pico USB OFF while moving wires. Remove all Pi SPI GPIO jumpers.</text>
<text x="48" y="151" class="small">The Pi connects to the Pico by USB only; no Pi header pins connect to this circuit.</text>
