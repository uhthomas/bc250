<rect x="48" y="954" width="1104" height="43" rx="5" fill="#e7edf1"/>
<text x="108" y="981" class="row">NO WIRE: J4004 VCC, Pico pin 31 / GP26, Pico 3V3</text>
<text x="32" y="1061" class="small">Existing 10 kΩ pull-up remains between flash pin 1 and flash pin 8 VCC. No direct VCC-to-Pico 3V3 wire.</text>
